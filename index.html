<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Смета за 5 минут</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="page-header">
      <h1>Смета за 5 минут</h1>
      <p>Добавьте позиции и цены — смета посчитает всё сама.</p>
    </header>
    <h1 id="print-title" class="print-only"></h1>

    <section class="card" aria-labelledby="details-title">
      <h2 id="details-title">Реквизиты</h2>
      <div class="details-grid">
        <label>От кого<input type="text" name="sender" placeholder="Ваше имя или компания"></label>
        <label>Для кого<input type="text" name="recipient" placeholder="Клиент или организация"></label>
        <label>Номер сметы<input type="text" name="estimate-number" placeholder="Например, 001"></label>
        <label>Дата<input type="date" name="date" id="estimate-date"></label>
      </div>
    </section>

    <section class="card positions" aria-labelledby="positions-title">
      <h2 id="positions-title">Позиции</h2>
      <table>
        <thead><tr><th scope="col">Наименование</th><th scope="col">Количество</th><th scope="col">Единица</th><th scope="col" id="price-heading">Цена, ₸</th><th scope="col">Сумма</th><th scope="col"><span class="sr-only">Удаление</span></th></tr></thead>
        <tbody id="items"></tbody>
      </table>
      <div id="undo-notice" class="undo-notice" hidden>
        <span role="status">Позиция удалена</span>
        <button type="button" id="undo-delete">Вернуть</button>
      </div>
      <button type="button" id="add-item" class="add-button">+ Добавить позицию</button>
      <div class="adjustments">
        <label>Скидка, %<input id="discount" type="text" inputmode="decimal" value="0" autocomplete="off"></label>
        <label>НДС, %<input id="vat" type="text" inputmode="decimal" value="0" autocomplete="off"></label>
        <label>Валюта<select id="currency"><option value="₸">₸</option><option value="₽">₽</option><option value="$">$</option><option value="€">€</option></select></label>
      </div>
    </section>

    <div class="card breakdown" aria-live="polite" aria-atomic="true">
      <div class="summary-row"><span>Сумма</span><output id="subtotal">0 ₸</output></div>
      <div class="summary-row" id="discount-row" hidden><span>Скидка</span><output id="discount-amount">0 ₸</output></div>
      <div class="summary-row" id="discounted-row" hidden><span>Сумма со скидкой</span><output id="discounted-amount">0 ₸</output></div>
      <div class="summary-row" id="vat-row" hidden><span>НДС</span><output id="vat-amount">0 ₸</output></div>
    </div>
    <section class="total-card" aria-labelledby="total-title">
      <h2 id="total-title">Итого к оплате</h2>
      <output id="total" aria-live="polite" aria-atomic="true">0 ₸</output>
    </section>
    <section class="card comment-card" aria-labelledby="comment-title">
      <h2 id="comment-title">Комментарий</h2>
      <label for="comment" class="sr-only">Комментарий: сроки, условия оплаты</label>
      <textarea id="comment" rows="4" placeholder="Сроки, условия оплаты"></textarea>
    </section>
    <p class="print-only signature">Подпись ____________________</p>
    <button type="button" id="save-pdf" class="pdf-button">Сохранить PDF</button>
    <div class="draft-actions">
      <button type="button" id="copy-whatsapp" class="add-button">Скопировать для WhatsApp</button>
      <button type="button" id="new-estimate" class="add-button">Новая смета</button>
      <button type="button" id="save-archive" class="add-button">Сохранить в архив</button>
    </div>
    <p id="copy-status" role="status" aria-live="polite"></p>
    <p id="storage-status" role="status"></p>
    <div id="manual-copy" hidden>
      <label for="copy-text">Скопируйте текст вручную</label>
      <textarea id="copy-text" rows="10" readonly></textarea>
    </div>
    <section class="card archive" aria-labelledby="archive-title">
      <h2 id="archive-title">Архив смет</h2>
      <p id="archive-status" role="status"></p>
      <ul id="archive-list"></ul>
    </section>
  </main>
  <template id="item-template">
    <tr>
      <td data-label="Наименование"><input class="item-name" type="text" placeholder="Товар или услуга" aria-label="Наименование"><button type="button" class="duplicate-button">Дублировать</button></td>
      <td data-label="Количество"><input class="quantity" type="text" inputmode="decimal" placeholder="0" aria-label="Количество" autocomplete="off"></td>
      <td data-label="Единица"><select aria-label="Единица"><option>шт</option><option>час</option><option>услуга</option></select></td>
      <td data-label="Цена, ₸"><input class="price" type="text" inputmode="decimal" placeholder="0" aria-label="Цена в тенге" autocomplete="off"></td>
      <td data-label="Сумма" class="amount-cell"><output class="line-total">0 ₸</output></td>
      <td class="delete-cell"><button type="button" class="delete-button" aria-label="Удалить позицию">✕</button></td>
    </tr>
  </template>
</body>
</html>
